// Flat, independent snapshots avoid recursively copying the entire undo stack.
function copy(value){return JSON.parse(JSON.stringify(value))}
function advanceWithHistory(s,r=Math.random){
if(!s.alive||s.pending||(s.familyDecisions||[]).length)return {ok:false,message:'Finish the current choice and family education decisions first.'};
ensure(s);const {rewindHistory,...current}=s;
const snapshot=copy(current);

function canRewind(s){return Array.isArray(s.rewindHistory)&&s.rewindHistory.length>0}
function rewind(s){
if(!canRewind(s))return {ok:false,message:'No previous year is available for this life.'};
const history=s.rewindHistory;
const restored=copy(history[history.length-1]);
for(const key of Object.keys(s))delete s[key];
Object.assign(s,restored);
if(history.length>1)s.rewindHistory=history.slice(0,-1);

}
function validateHistory(s){
validateSave(s);validateFamily(s);
if(s.rewindHistory!==undefined){
if(!Array.isArray(s.rewindHistory)||s.rewindHistory.length>150)throw Error('Invalid saved year history.');
let previous=null;
for(const snapshot of s.rewindHistory){
if(!snapshot||Object.hasOwn(snapshot,'rewindHistory'))throw Error('Invalid nested year history.');
validateSave(snapshot);

function familyProgress(){return `<div class="card actioncard"><h2>Your family’s lives</h2><p>Close family members progress through school, university, careers, retirement and health events each year. Open a child’s profile to encourage their studies or career.</p><p>Allowance: 0.1% of your cash per month per dependent child, capped at $1,000. Total annual allowances use at most 10% of cash remaining after reserving one year of living costs. Children under 18 and university students qualify. Use Set allowance on any living relationship for your own monthly amount, or to stop payments. Custom allowances take priority; if cash is insufficient they are reduced proportionally. Automatic allowances are calculated from the remaining cash.</p>${state.familyReports.length?btn('Latest yearly report','family-report'):''}<details><summary>Previous family reports (${state.familyReports.length})</summary>${state.familyReports.map(r=>`<details><summary>Your age ${r.age}</summary>${r.events.map(e=>`<p>${esc(e.text)}</p>`).join('')}</details>`).join('')}</details></div><div class="sectionspace"></div>`}


const xbtn=(label,type,data={},disabled=false)=>`<button class="btn small" type="button" data-do="expansion" data-payload="${esc(JSON.stringify({type,...data}))}" ${disabled?'disabled':''}>${esc(label)}</button>`;
function personDepth(p){Life.ensurePerson(p);return `<p><b>${esc(p.personality)}</b> · Enjoys ${esc(p.interest)} · Trust ${p.trust}%<br>${esc(p.relationshipStatus)}${p.partnerId?' · Partner: '+esc(state.people.find(x=>x.id===p.partnerId)?.name||'Recorded connection'):''}<br>Goal: ${esc(p.goal.kind)} · ${p.goal.complete?'Achieved':p.goal.progress+'% progress'}</p><details><summary>Meaningful conversations · 1 time point</summary><div class="choices">${[['listen','Listen to their concerns'],['interest','Share their interest'],['ambition','Offer advice about their goals'],['pressure','Pressure them to follow your plan'],['apologize','Apologize and repair trust'],['fairness','Discuss fairness in the family'],['goal','Support their goal · $1,000']].map(([topic,label])=>xbtn(label,'conversation',{personId:p.id,topic},!!state.used['conversation-'+p.id])).join('')}</div></details><details class="sectionspace"><summary>Make a promise · due within two years</summary><p>Broken promises hurt trust. Fulfill commitments in Life plans.</p><div class="choices">${[['visit','Promise a day together'],['support','Promise $1,000 support'],['tuition','Promise $12,000 education support']].map(([kind,label])=>xbtn(label,'promise',{personId:p.id,kind},state.age<18)).join('')}</div></details><details class="sectionspace"><summary>Relationship memories (${p.memories.length})</summary>${p.memories.map(m=>`<p>${m.actor?esc(m.actor)+' · ':''}Age ${m.age}: ${esc(m.text)}</p>`).join('')||'<p>No recorded memories yet.</p>'}</details>`}
function socialPanel(){const invitations=state.invitations.filter(i=>i.status==='Pending'&&state.people.some(p=>p.id===i.personId&&p.alive));return `<div class="card actioncard"><h2>Invitations & social life</h2><p>People remember your attention, promises and fairness. Expensive gifts do not erase damaged trust. Unanswered invitations expire at your next age-up.</p>${invitations.map(i=>`<div class="listrow"><div><h3>${esc(i.title)}</h3><p>From ${esc(state.people.find(p=>p.id===i.personId)?.name)} · ${cash(i.cost)} · 1 time point</p></div><div class="rowactions">${xbtn('Attend','inviteReply',{id:i.id,reply:'attend'})}${xbtn('Decline politely','inviteReply',{id:i.id,reply:'decline'})}</div></div>`).join('')||'<p>No pending invitations. New invitations arrive as years pass.</p>'}${xbtn('Host a gathering · $500 · 2 time','host',{},state.age<16||!!state.used.host)}</div><div class="sectionspace"></div>`}
function plans(){const s=state;return `<div class="banner"><h2>A life beyond the numbers</h2><p>${s.time} free time points remain this year. Relationships, ambitions and responsibilities compete for your attention.</p></div><div class="card actioncard"><h3>Shared household</h3><p>Arrangement: ${esc(s.housingMode)}. ${s.independentLiving?'Annual budget '+cash(Life.householdCost(s)):'Base living costs covered by family'}. Independent budgets include $1,500 per child and $2,500 per adult living with you. Adult contributors pay up to $2,000/year from their actual cash.</p><div class="rowactions">${xbtn('Stay with family','housing',{mode:'family'},s.age<18)}${xbtn('Rent independently','housing',{mode:'rent'},s.age<18)}${xbtn('Live in owned home','housing',{mode:'own'},s.age<18)}</div>${s.people.filter(p=>p.alive).map(p=>`<div class="listrow"><div><b>${esc(p.name)}</b><p>${p.livesWithYou?'Lives with you':'Lives separately'}${p.contributes?' · Contributes to costs':''}</p></div><div class="rowactions">${xbtn(p.livesWithYou?'Ask to move out':'Invite to live here','housemate',{personId:p.id,mode:p.livesWithYou?'leave':'invite'},s.age<18||(p.livesWithYou&&p.age<18))}${p.livesWithYou&&p.age>=18?xbtn(p.contributes?'Stop contribution':'Agree cost contribution','housemate',{personId:p.id,mode:'contribute'},s.age<18):''}</div></div>`).join('')}</div><div class="card actioncard sectionspace"><h3>Promises & commitments</h3><p>Make promises in relationship profiles. Fulfill them before the shown age; simply making a promise does not transfer money.</p>${s.promises.map(p=>`<div class="listrow"><div><b>${esc(p.label)}</b><p>To ${esc(s.people.find(x=>x.id===p.personId)?.name||'Former connection')} · Due before age ${p.due} · ${esc(p.status)}</p></div>${p.status==='Open'?xbtn('Keep promise · 1 time','fulfill',{id:p.id}):''}</div>`).join('')||'<p>No promises yet.</p>'}</div><div class="card actioncard sectionspace"><h3>Long-term projects</h3><p>One active project at a time. Each step costs 2 time points and can be completed once per year. Completing a project improves your skills or asset value and introduces a new friend. Completed renovations and restorations add 50% of the total project cost to asset value.</p>${s.projects.map(p=>{const d=Life.projectTypes[p.kind];return `<div class="listrow"><div><b>${esc(d.name)}</b><progress max="${d.steps}" value="${p.progress}" aria-label="Project progress"></progress><p>${p.progress}/${d.steps} steps · ${esc(p.status)} · ${cash(d.cost)} per step</p></div>${p.status==='Active'?xbtn('Work on project','projectWork',{id:p.id},!!s.used['project-'+p.id]):''}</div>`}).join('')}<form id="project-form"><label for="project-kind">Start a project</label><select id="project-kind" name="kind">${Object.entries(Life.projectTypes).map(([id,p])=>`<option value="${id}">${esc(p.name)} · ${p.steps} steps · ${cash(p.cost)}/step</option>`).join('')}</select><label class="sectionspace" for="project-asset">For restoration or renovation, choose an owned asset</label><select id="project-asset" name="assetId"><option value="">No asset (music / marathon)</option>${s.assets.filter(a=>['cars','homes'].includes(Life.assetCategory(a))).map(a=>`<option value="${a.uid}">${esc(a.name)} · #${a.uid}</option>`).join('')}</select><button class="btn primary sectionspace" type="submit" ${s.age<12?'disabled':''}>Start project</button></form></div>`}
function managerPanel(){const m=state.financialManager;return `<div class="card actioncard sectionspace"><h2>Financial manager</h2><p>${m?.active?'Hired':'Not active'} · 5% performance fee · No fee on your deposits</p><p>Choose the percentage of yearly income to reinvest and a minimum cash reserve. Income means gross salary, pension, rent and investment distributions received during the age-up; asset sales, gifts, borrowing and unrealized gains are excluded. Investing runs after annual bills and allowances. Up to 40% buys rental homes and 10% buys appreciating jewelry when affordable; remaining money is spread across the diversified fund (50%), bond fund (30%) and three stocks (20%). New cars are skipped because they depreciate.</p>${m?.needsPercentage?'<p>Your previous fixed-amount plan is paused. Choose an income percentage to restart it.</p>':''}<form id="manager-form"><label for="manager-budget">Yearly income to reinvest (%)</label><input id="manager-budget" name="budget" type="number" min="0" max="100" step="0.01" value="${m?.incomePercent??20}" required><label for="manager-reserve">Keep at least this much cash</label><input id="manager-reserve" name="reserve" value="${m?.reserve??25000}" required maxlength="40"><div class="rowactions sectionspace"><button class="btn primary" type="submit">${m?.active?'Update plan':'Hire manager'}</button>${m?.active?btn('Stop manager','manager-stop'):''}</div></form><p>The fee is 5% of net annual returns from manager-bought holdings, including unrealized value changes and income after investment taxes and upkeep. Past losses must be recovered first. No guaranteed returns. Unaffordable fees remain due and pause new purchases. Stopping leaves your holdings in place.</p>${m?`<p>Losses to recover: ${cash(m.loss)} · Unpaid fees: ${cash(m.due)}</p><details><summary>Manager reports · ${m.reports.length}</summary>${m.reports.map(r=>`<div class="listrow"><div><h3>Age ${r.age} · Invested ${cash(r.spent)}</h3>${r.yearlyIncome!==undefined?`<p>Income ${cash(r.yearlyIncome)} × ${r.incomePercent}% = ${cash(r.target)} target</p>`:''}<p>Net return ${cash(r.profit)} · Fee earned ${cash(r.fee)} · Paid ${cash(r.paid)} · Still due ${cash(r.due)}</p><p>${r.purchases.map(p=>esc(p.name)+(p.count?' × '+p.count:'')+': '+cash(p.amount)).join('<br>')||'No purchases this year.'}</p></div></div>`).join('')}</details>`:''}</div>`}
function investments(){const s=state,total=Life.portfolioValue(s),basis=s.portfolio.reduce((n,h)=>n+h.basis,0);return `<div class="banner"><h2>Funds & stock market</h2><p>Fictional investments with simulated yearly prices. Values can fall. Returns are not guaranteed. Shares may be fractional; no trading fees.</p></div>${portfolioVisuals()}${managerPanel()}<div class="minigrid">${[['Portfolio value',total],['Amount invested',basis],['Unrealized gain / loss',total-basis]].map(([n,v])=>`<div class="card metric"><div class="label">${n}</div><div class="value">${cash(v)}</div></div>`).join('')}</div><div class="card actioncard"><p>Prices change when you age up. Cash distributions are paid yearly and taxed at your country’s game rate. Positive gains are taxed when sold; unrealized gains are not cash income.</p><form id="invest-form"><label for="investment-ticker">Investment</label><select id="investment-ticker" name="ticker">${Life.investmentProducts.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.kind} · Unit price $${s.market[p.id].toFixed(2)}</option>`).join('')}</select><label class="sectionspace" for="investment-amount">Amount to invest</label><input id="investment-amount" name="amount" placeholder="1000, 10k or 1 million" required maxlength="40"><button class="btn primary sectionspace" type="submit" ${s.age<18?'disabled':''}>Invest cash</button></form></div><div class="card sectionspace">${Life.investmentProducts.map(p=>{const h=s.portfolio.find(x=>x.ticker===p.id);return `<div class="listrow"><div><h3>${esc(p.name)}</h3><p>${p.kind} · $${s.market[p.id].toFixed(2)}/unit · Annual price range ${Math.round((p.growth-p.risk)*100)}% to +${Math.round((p.growth+p.risk)*100)}% · Distribution ${p.yield*100}%</p><p>${h?h.units.toFixed(4)+' units · Value '+cash(Math.round(h.units*s.market[p.id])):'Not owned'}</p></div>${h?btn('Sell holding','sell-investment',p.id,s.age<18):''}</div>`}).join('')}</div><p class="sub">Investment ownership is included in net worth and family succession. Market history and all trades are included in saves and undo.</p>`}


function elite(){const contacts=state.people.filter(p=>p.alive&&p.life&&Life.netWorth(p.life)>=1000000);return `<div class="banner"><div class="eyebrow">ELITE COMMUNITY</div><h2>Make your next introduction.</h2><p>Private outings, memorable celebrations and affluent new connections. Choose family companions before booking any event.</p><p>Community reputation: ${state.eliteReputation}/100 · Your net worth: ${cash(Life.netWorth(state))}</p></div>${['Outing','Hosted'].map(mode=>`<div class="sectionhead sectionspace"><h2>${mode==='Hosted'?'Host an elite event':'Elite outings'}</h2></div><div class="grid">${Life.eliteEvents.filter(e=>e.mode===mode).map(e=>`<div class="card actioncard">${scene(e.id)}<h3>${esc(e.name)}</h3><p>${esc(e.description)}</p><p>${cash(e.cost)} base + ${cash(e.guestCost)} per family guest · ${e.time} time points<br>${e.wealth?'Requires '+cash(e.wealth)+' net worth':'No wealth requirement'} · ${e.minGuestAge?'Guests age '+e.minGuestAge+'+':'All family ages welcome'}<br>Meet ${e.contacts} wealthy ${e.contacts===1?'contact':'contacts'} · Once per year</p>${btn(state.used['elite-'+e.id]?'Done this year':'Choose family & book','elite-event',e.id,!!state.used['elite-'+e.id]||state.age<18||!state.alive||Life.netWorth(state)<e.wealth)}</div>`).join('')}</div>`).join('')}<div class="card sectionspace"><div class="sectionhead"><h2>Your affluent connections · ${contacts.length}</h2></div>${contacts.map(p=>`<div class="listrow"><div><h3>${esc(p.name)}</h3><p>${esc(p.role)} · ${esc(p.gender)} · Age ${p.age}<br>${esc(Life.status(p.life))}<br>${p.datingOrigin?esc(Life.datingWealth(p)):'Net worth: '+cash(Life.netWorth(p.life))}<br>Community reputation: ${p.communityReputation??Life.communityReputation(p.life)}/100<br>${p.role==='Spouse'?'Married':p.engaged?'Engaged':p.role==='Partner'?'Dating':esc(p.relationshipStatus)} · Bond ${p.bond}% · Trust ${p.trust}%<br>${esc(p.personality)} · Enjoys ${esc(p.interest)}<br>Goal: ${esc(p.goal.kind)} · ${p.goal.complete?'Achieved':p.goal.progress+'% progress'}<br>Looking for: ${esc(p.intention||'Not shared yet')}${p.datingOrigin?'<br>Compatibility: '+Life.datingCompatibility(state,p)+'%':''}</p></div>${btn('Get to know them','person',p.id)}</div>`).join('')||'<p class="empty">Attend an event to meet wealthy contacts. Their financial lives continue independently afterward.</p>'}</div><div class="card actioncard sectionspace"><details><summary>Event history · ${state.socialEvents.length}</summary>${state.socialEvents.map(e=>`<div class="listrow"><div><h3>${esc(e.title)} · Age ${e.age}</h3><p>${esc(e.mode)} · ${cash(e.cost)}<br>Family guests: ${e.guests.map(esc).join(', ')||'None'}${e.contacts.length?'<br>New contacts: '+e.contacts.map(esc).join(', '):''}</p></div></div>`).join('')||'<p>No events attended yet.</p>'}</details></div>`}
function eventGuestPicker(type,id){let title,base,perGuest,minAge=0,time;if(type==='elite'){const e=Life.eliteEvents.find(e=>e.id===id);if(!e)return;({name:title,cost:base,guestCost:perGuest,minGuestAge:minAge,time}=e)}else if(type==='host'){title='Host a family & friends gathering';base=500;perGuest=100;time=2}else{const e=state.invitations.find(e=>e.id===Number(id)&&e.status==='Pending');if(!e)return;title=e.title;base=e.cost;perGuest=e.cost;time=1}const family=state.people.filter(p=>p.alive&&Life.isFamily(state,p));modal(`<div class="eyebrow">CHOOSE YOUR FAMILY GUESTS</div><h2>${esc(title)}</h2><p>Select anyone you want to bring, or leave everyone unchecked to go alone. ${time} time points. ${minAge?'Guests must be at least '+minAge+'.':'All ages welcome.'}</p><form id="event-rsvp" data-base-cost="${base}" data-guest-cost="${perGuest}"><input type="hidden" name="eventType" value="${type}"><input type="hidden" name="eventId" value="${esc(id||'')}"><div class="guest-list">${family.map(p=>`<label class="guest-option"><input type="checkbox" name="guests" value="${p.id}" ${p.age<minAge?'disabled':''}><span>${esc(p.name)} · ${esc(p.role)} · Age ${p.age}${p.age<minAge?' (below event age limit)':''}</span></label>`).join('')||'<p>No eligible family relationships yet. You can still attend alone.</p>'}</div><p>Base ${cash(base)} + ${cash(perGuest)} per selected guest.</p><p id="event-total"><b>Total: ${cash(base)}</b></p><div class="modalfoot">${btn('Cancel','close')}<button class="btn primary" type="submit">Confirm booking</button></div></form>`)}
function updateEventQuote(form){const count=form.querySelectorAll('input[name="guests"]:checked').length;const total=Number(form.dataset.baseCost)+Number(form.dataset.guestCost)*count;$('event-total').textContent='Total: '+cash(total)+' · '+count+' family guests'}

function datingPanel(){const d=state.dating;const cards=d.pool.filter(p=>(d.gender==='Any'||p.gender===d.gender)&&p.age>=d.minAge&&p.age<=d.maxAge);return `<div class="card actioncard sectionspace"><h2>Dating app</h2>${state.age<18?'<p>Available from age 18.</p>':`<p>Your profile: ${esc(state.name)} · ${state.age} · ${esc(state.gender)} · ${esc(Life.status(state))}<br>Community reputation: ${Life.communityReputation(state)}/100</p><details id="dating-preferences" ${datingSettingsOpen?'open':''}><summary>Your dating profile & filters</summary><form id="dating-settings"><div class="grid"><label>Meet<select name="gender">${['Any','Male','Female'].map(v=>`<option ${d.gender===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Looking for<select name="intention">${['Casual dating','Serious relationship','Marriage'].map(v=>`<option ${d.intention===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Minimum age<input name="minAge" type="number" min="18" max="120" value="${d.minAge}" required></label><label>Maximum age<input name="maxAge" type="number" min="18" max="120" value="${Math.min(120,d.maxAge)}" required></label><label>Your favorite interest<select name="interest">${['music','fitness','travel','art'].map(v=>`<option ${d.interest===v?'selected':''}>${v}</option>`).join('')}</select></label></div><button class="btn" type="submit">Save profile & filters</button></form></details><p>Eight nearby-age introductions each year. Likes cost 1 time point and need mutual interest. Wealth estimates may be inaccurate; only verified figures show exact finances. Community reputation reflects social participation, trust and kept or broken promises.</p>${btn('Discover this year’s profiles','dating-browse','',d.lastRefresh===state.age)}<div class="grid">${cards.map(p=>`<div class="card actioncard"><h3>${esc(p.name)} · ${p.age} · ${esc(p.gender)}</h3><p>${esc(p.occupation)} · ${esc(p.personality)}<br>Enjoys ${esc(p.interest)} · ${esc(p.intention)}<br>Interested in: ${esc(p.preferredGender)}<br>Reputation ${p.communityReputation}/100 · Compatibility ${Life.datingCompatibility(state,p)}%<br>${esc(Life.datingWealth(p))}</p>${btn(p.matchStatus==='Declined'?'No match':'Like profile · 1 time','dating-like',p.id,p.matchStatus!=='Available')}</div>`).join('')||'<p>No profiles match these filters. Discover profiles or broaden your age and gender preferences.</p>'}</div><details><summary>Your matches</summary>${state.people.filter(p=>p.datingOrigin&&p.alive).map(p=>`<div class="listrow"><div><h3>${esc(p.name)}</h3><p>${esc(p.datingStage)} · ${esc(p.role)}</p></div>${btn('Chat & dates','person',p.id)}</div>`).join('')||'<p>No mutual matches yet.</p>'}</details>`}</div>`}
function datingControls(p){if(!p.datingOrigin)return '';return `<details class="sectionspace"><summary>Dating app · ${esc(p.datingStage)}</summary><p>${esc(p.intention)} · Community reputation ${p.communityReputation}/100<br>${esc(Life.datingWealth(p))}</p><div class="choices">${[['chat','Chat · 1 time'],['coffee','Coffee date · $40 · 1 time'],['dinner','Dinner date · $200 · 1 time'],['disclose','Ask about finances · 1 time']].map(([action,label])=>`<button class="choice" data-do="dating-action" data-id="${p.id}" data-action="${action}">${label}</button>`).join('')}</div><p>One chat, date and financial conversation per year. Trust of 65 allows financial disclosure. Use Dating & romance to ask for exclusivity or propose.</p></details>`}
function relationshipGroup(p){if(!p.alive&&Life.isFamily(state,p))return 0;if(['Spouse','Partner'].includes(p.role))return 2;if(p.role==='Child')return 3;if(Life.isFamily(state,p))return 1;return 4}
function sortedRelationships(){return [...state.people].sort((a,b)=>relationshipGroup(a)-relationshipGroup(b)||b.bond-a.bond||a.name.localeCompare(b.name)||a.id-b.id)}
function people(){const panels={family:()=>familyTree()+familyProgress(),dating:datingPanel,invitations:socialPanel,succession:familyPanel};const tabs=peopleTabs();if(peopleView!=='connections')return tabs+panels[peopleView]();return `${tabs}<div class="banner"><h3>The people in your story</h3><label for="people-search">Find a connection</label><input id="people-search" value="${esc(peopleSearch)}" placeholder="Name or relationship"><p>${state.people.length} connections · Showing up to ${peopleLimit}</p>${btn('Show more','people-more','',peopleLimit>=state.people.length)}<label for="character-gender">Your gender</label><select id="character-gender">${['Male','Female'].map(g=>`<option ${state.gender===g?'selected':''}>${g}</option>`).join('')}</select>${state.pregnancies.length?'<p>An unexpected pregnancy is ongoing. A child is expected next year.</p>':''}<p>Grouped by family and relationship type, with the highest bond first in each group.</p><div class="sectionspace">${btn('Meet someone','date','',state.age<18)}</div></div><div class="card">${state.people.length?sortedRelationships().filter(p=>(p.name+' '+p.role).toLowerCase().includes(peopleSearch.toLowerCase())).slice(0,peopleLimit).map((p,index,list)=>`${index===0||relationshipGroup(p)!==relationshipGroup(list[index-1])?'<div class="sectionhead"><h2>'+['Deceased family','Family','Spouse & partner','Children','Friends & other connections'][relationshipGroup(p)]+'</h2></div>':''}<div class="listrow"><div>${portrait(p)}<h3>${esc(p.name)} ${!p.alive?'✧':''}</h3><p>${esc(p.role)} · ${esc(p.gender)} · ${p.alive?`Age ${p.age}`:'Remembered'} · Bond ${p.bond}%</p><p><b>${p.alive?'Net worth':'Recorded estate balance'}: ${p.datingOrigin?esc(Life.datingWealth(p)):cash(p.life?Life.netWorth(p.life):0)}</b>${!p.life?' · Financial records begin at $0':''}</p><div class="bar" style="width:160px;margin-top:10px"><i style="width:${p.bond}%;background:#5dab8a"></i></div></div><div class="rowactions">${btn(p.alive?'Spend time':'Remember','person',p.id)}${p.alive?btn('Set allowance','allowance-settings',p.id,!state.alive):''}${p.alive&&['Mother','Father'].includes(p.role)?btn('Give money','parent-gift',p.id,!state.alive):''}</div></div>`).join(''):'<div class="empty">Your next connection is still out there.</div>'}</div>`}

let assetCategory='all';const expandedAssets=new Set();

air?xbtn('Repair · '+cash(Math.max(500,Math.round(a.value*.005))),'property',{id:a.uid,mode:'repair'}):''):''}${btn('Details & keepsake','asset-details',a.uid)}${btn('Gift','gift-asset',a.uid,!state.alive||state.age<18,'small')}${btn('Sell','confirm-sell',a.uid,false,'small')}</div></div>`).join('')||'<p class="empty">No possessions in this category.</p>'}${items.length>assetLimit?btn('Show more possessions','asset-more'):''}</details>`}).join('')}<div class="actioncard"><p>Game valuation rules: cars appreciate 5% per year from age 30. Homes and apartments gain an extra 2 percentage points of annual appreciation from age 60. Age carries through gifts and inheritance.</p></div></div>`}

function financialEntry(e){return `<tr><td data-label="Age">${e.age}</td><td data-label="Details"><b>${esc(e.reason)}</b><small>${esc(e.category)} · ${esc(e.account)}<br>${e.amount>=0?'From':'To'} ${esc(e.party)}</small></td><td data-label="Change" class="${e.amount<0?'negative':''}">${e.amount>0?'+':''}${cash(e.amount)}</td><td data-label="Balance">${cash(e.balance)}</td></tr>`}
function financialRows(rows){const grouped=new Map(),display=[];for(const e of rows.slice().reverse()){const product=['Rent','Upkeep','Property management'].includes(e.category)&&Life.products.find(p=>p.name===e.reason);if(!product){display.push({entry:e});continue}const label={homes:'Homes & apartments',cars:'Cars',jewelry:'Jewelry'}[Life.assetCategory(product)],key=JSON.stringify([e.age,e.account,label]);let g=grouped.get(key);if(!g){g={age:e.age,account:e.account,label,entries:[]};grouped.set(key,g);display.push(g)}g.entries.push(e)}return display.map(g=>{if(g.entry)return financialEntry(g.entry);const income=g.entries.filter(e=>e.amount>0).reduce((n,e)=>n+e.amount,0),expense=-g.entries.filter(e=>e.amount<0).reduce((n,e)=>n+e.amount,0),count=Math.max(g.entries.filter(e=>e.category==='Upkeep').length,g.entries.filter(e=>e.category==='Rent').length);return `<tr><td>${g.age}</td><td colspan="3"><details><summary><b>${g.label} · ${count} assets</b><br><span class="compact">Income ${cash(income)} · Expenses ${cash(expense)} · Net ${cash(income-expense)}</span></summary><p class="sub">${esc(g.account)} · Annual rent and upkeep. Purchases, sales and loan payments remain separate. Expand individual records below for the exact running balances.</p><table class="ledger"><thead><tr><th>Age</th><th>Transaction</th><th>Change</th><th>Balance</th></tr></thead><tbody>${g.entries.map(financialEntry).join('')}</tbody></table></details></td></tr>`}).join('')||'<tr><td colspan="4">No transactions for this selection.</td></tr>'}

>`<div class="listrow"><div><h3>${esc(l.kind)}</h3><p>${cash(l.balance)} remaining · ${l.rate*100}% interest · ${cash(l.payment)}/year · ${l.years} payments left</p><p>Next year: ${cash(Math.round(l.balance*l.rate))} interest + up to ${cash(Math.min(l.balance,l.payment-Math.round(l.balance*l.rate)))} principal.</p></div>${btn('Pay off','repay-offer',l.id,s.cash<l.balance||!s.alive)}</div>`).join(''):'<p class="empty">No outstanding loans. Student financing is available in Career; mortgages are available in Assets.</p>'}</div><div class="card actioncard sectionspace"><h3>Transaction history</h3><div class="grid"><div><label for="finance-age">Age / year</label><select id="finance-age"><option value="all">All years</option>${[...new Set(s.ledger.map(e=>e.age))].sort((a,b)=>b-a).map(a=>`<option value="${a}" ${String(a)===financeAge?'selected':''}>Age ${a}</option>`).join('')}</select></div><div><label for="finance-account">Account</label><select id="finance-account"><option value="all">All accounts</option>${[...new Set(s.ledger.map(e=>e.account))].map(a=>`<option ${a===financeAccount?'selected':''}>${esc(a)}</option>`).join('')}</select></div></div><p>Showing the newest ${Math.min(rows.length,ledgerLimit)} of ${rows.length} underlying transactions. Groups below summarize the displayed records. Asset rent and upkeep are grouped by category and year; expand a summary for details. Older saves begin with an opening balance; earlier transactions cannot be reconstructed.</p><details><summary>Totals by category for this selection</summary>${Object.entries(groups).map(([n,v])=>`<p>${esc(n)}: ${cash(v)}</p>`).join('')}</details><div class="ledger-scroll"><table class="ledger transactions-ledger"><thead><tr><th>Age</th><th>Details</th><th>Change</th><th>Balance</th></tr></thead><tbody>${financialRows(rows.slice(-ledgerLimit))}</tbody></table></div>${rows.length>ledgerLimit?btn('Show more transactions','ledger-more'):''}</div>`

function showPerson(id){const p=state.people.find(p=>p.id===Number(id));if(!p)return;if(profileId!==p.id)profileView='overview';profileId=p.id;if(p.alive&&!p.life){Life.connectionProfile(state,id);dirty=true;lifeRevision++;scheduleRecovery()}const finance=p.life&&(!p.datingOrigin||p.wealthVisibility==='Verified')?`<div class="minigrid">${metric('Net worth',cash(Life.netWorth(p.life)))}${metric('Cash',cash(p.life.cash))}${metric('Debt',cash(p.life.loans.reduce((n,l)=>n+l.balance,0)))}</div><p>${esc(Life.status(p.life))}${p.life.job?' · Salary '+cash(p.life.job.pay):''}</p>`:`<p>${esc(Life.datingWealth(p)||'Financial information not recorded.')}</p>`;const actions=`${personEnhancements(p)}${personDepth(p)}${datingControls(p)}${romancePanel(p)}<div class="choices">${[['time','Spend time together'],['gift','Give a thoughtful gift · $100'],...(p.role==='Partner'?[['marry','Get married · $1,500']]:[]),...(['Partner','Spouse'].includes(p.role)?[['child','Welcome a child'],['breakup','End the relationship']]:[])].map(([a,n])=>`<button class="choice" data-do="interact" data-id="${p.id}" data-action="${a}" ${state.used[`${p.id}-${a}`]?'disabled':''}>${n}</button>`).join('')}</div><details><summary>More ways to connect</summary>${Object.entries(Life.connectionActions).map(([action,a])=>`<button class="choice" data-do="connect" data-id="${p.id}" data-action="${action}">${esc(a.name)}${a.cost?' · '+cash(a.cost):''}</button>`).join('')}</details>${btn('Set allowance','allowance-settings',p.id,!state.alive)}${['Mother','Father'].includes(p.role)?btn('Give money','parent-gift',p.id):''}${p.role==='Child'?btn('Encourage studying','encourage-study',p.id)+btn('Encourage career','encourage-career',p.id):''}`;modal(`<div class="profile-sheet">${portrait(p,true)}<div class="eyebrow">${esc(p.role)} · ${esc(p.gender)} · AGE ${p.age}</div><h2>${esc(p.name)}${p.alive?'':' · Remembered'}</h2><div class="subtabs">${['overview','interactions','memories','finances'].map(v=>btn(v[0].toUpperCase() async function save(){if(saving)return;saving=true;toast('Preparing a compact save…');try{await new Promise(resolve=>setTimeout(resolve,0));const revision=lifeRevision,savedState=state,name=state.name,age=state.age;const text=JSON.stringify(Life.packSave(state));let blob=new Blob([text],{type:'application/json'}),extension='.parallel.json';if(typeof CompressionStream==='function'){blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();extension='.parallel.gz'}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`parallel-${name.replace(/[^a-z0-9]/gi,'-')}-age-${age}${extension}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);if(state===savedState&&lifeRevision===revision)dirty=false;render();toast(`Save downloaded (${blob.size<1048576?(blob.size/1024).toFixed(1)+' KB':(blob.size/1048576).toFixed(1)+' MB'}). All undo history included.`)}catch(err){toast('Could not save: '+err.message)}finally{saving=false}}
async function readLifeFile(file){const limit=512*1024*1024;if(file.size>limit)throw Error('Save exceeds the 512 MB import limit.');const header=new Uint8Array(await file.slice(0,2).arrayBuffer());let stream=file.stream();if(header[0]===31&&header[1]===139){if(typeof DecompressionStream!=='function')throw Error('This browser cannot open compressed saves. Use a current browser.');stream=stream.pipeThrough(new DecompressionStream('gzip'))}const reader=stream.getReader(),decoder=new TextDecoder();let bytes=0;const chunks=[];try{while(true){const {done,value}=await reader.read();if(done)break;bytes+=value.byteLength;if(bytes>limit)throw Error('Expanded save exceeds the 512 MB import limit.');chunks.push(decoder.decode(value,{stream:true}))}chunks.push(decoder.decode());return Life.validate(Life.unpackSave(JSON.parse(chunks.join(''))))}finally{await reader.cancel().catch(()=>{})}}

function metric(label,value){return `<div class="metric card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
function portrait(p,large=false){const hue=((p.id||p.name.length)*47)%360;return `<span class="portrait ${large?'large':''}" style="--portrait-hue:${hue}" role="img" aria-label="${esc(p.name)} portrait, age ${p.age}"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="40" fill="hsl(${hue} 35% 89%)"/><path d="M10 80q0-30 30-30t30 30" fill="hsl(${hue} 35% 40%)"/><circle cx="40" cy="32" r="17" fill="#d9ac8a"/><path d="M23 30q-3-24 18-23 21 1 17 26l-7-16-27 14" fill="${p.age>=65?'#bec6ca':'#3c3540'}"/><circle cx="34" cy="33" r="1.5"/><circle cx="46" cy="33" r="1.5"/><path d="M35 41q5 4 10 0" fill="none" stroke="#805246" stroke-width="2"/></svg></span>`}
function scene(kind){const home=kind==='homes',car=kind==='cars',jewel=kind==='jewelry';return `<div class="scene" aria-hidden="true"><svg viewBox="0 0 240 80"><circle cx="198" cy="20" r="13" fill="#dfc58d"/><path d="M0 69Q60 40 120 65T240 59V80H0" fill="#b2d9c9"/>${home?'<path d="M55 39L105 7l50 32v36H55z" fill="#f9faf6"/><path d="M47 39l58-37 58 37" fill="none" stroke="#32534b" stroke-width="7"/><path d="M94 46h23v29M67 44h16v15m44-15h16v15" fill="#759b95"/>':car?'<path d="M40 55l24-7 22-23h50l23 23 23 7v15H40z" fill="#33566c"/><path d="M87 29h43l18 19H70z" fill="#b2dce2"/><circle cx="70" cy="68" r="12" fill="#26363d"/><circle cx="151" cy="68" r="12" fill="#26363d"/>':jewel?'<path d="M84 19h70l14 19-49 38-49-38z" fill="#88bfb3" stroke="#fff" stroke-width="3"/><path d="M84 19l35 57 35-57M70 38h98" fill="none" stroke="#fff" stroke-width="2"/>':'<path d="M42 65V26h140v39M35 26h155L113 4z" fill="#f4efdf" stroke="#54776e" stroke-width="3"/><path d="M60 29v36m30-36v36m30-36v36m30-36v36m20-36v36" stroke="#c5a865" stroke-width="7"/>'}</svg></div>`}
function characterStrip(){return `${mobileCharacterHeader()}<div class="character-strip">${portrait(state)}<div><strong>${esc(state.name)}</strong><small>Age ${state.age} · ${esc(state.gender)} · Generation ${state.generation}</small></div><div><small>Cash</small><strong>${cash(state.cash)}</strong></div><div><small>Net worth</small><strong>${cash(Life.netWorth(state))}</strong></div><div><small>Time & energy</small><strong>${state.time} / 32</strong></div>${tab!=='journal'?`<div class="mini-stats">${Object.entries(state.stats).map(([k,v])=>`<span>${esc(k)} ${v}%</span>`).join('')}</div>`:''}</div>`}
function actionDock(){return `<div class="action-dock"><span>${dirty?'● Unsaved progress':'Your next chapter awaits'}</span>${btn('<span class="desktop-label">Save life</span><span class="phone-label">Save</span>','save')}${btn('<span class="desktop-label">'+(state.rewindHistory?.at(-1)?.generation<state.generation?'↶ Undo succession':'↶ Back one year')+'</span><span class="phone-label">Undo</span>','rewind','',!Life.canRewind(state))}${btn('<span class="desktop-label">'+(state.alive?(state.pending?'Resolve current choice':'＋ Age one year'):'View legacy')+'</span><span class="phone-label">'+(state.alive?(state.pending?'Your choice':'Next year'):'Legacy')+'</span>',state.alive?'age':'legacy','',false,'primary')}</div>`}
function peopleTabs(){return `<div class="subtabs" aria-label="Relationship views">${[['connections','Connections'],['family','Family'],['dating','Dating'],['invitations','Invitations'],['succession','Succession']].map(([id,label])=>btn(label,'people-view',id,false,peopleView===id?'primary':'')).join('')}</div>`}
function familyTree(){return `<div class="banner"><h2>Your family, across generations</h2><p>Expand each branch to explore recorded relationships.</p></div><div class="card actioncard family-tree">${[['Parents & grandparents',['Mother','Father','Grandmother','Grandfather','Stepparent']],['Partners & siblings',['Partner','Spouse','Sibling']],['Children & grandchildren',['Child','Grandchild']]].map(([label,roles])=>`<details><summary>${label} · ${state.people.filter(p=>roles.includes(p.role)).length}</summary><div class="family-nodes">${state.people.filter(p=>roles.includes(p.role)).map(p=>`<div class="family-node">${portrait(p)}${btn(esc(p.name),'person',p.id)}<small>${esc(p.role)} · ${p.age}${p.alive?'':' · Remembered'}</small>${p.coParentId?'<small>Co-parent: '+esc(state.people.find(x=>x.id===p.coParentId)?.name||'Recorded elsewhere')+'</small>':''}</div>`).join('')}</div></details>`).join('')}</div>`}
function yearlyCash(age){const excluded=['Opening balance','Transfer','Borrowing','Repayment','Asset purchase','Asset sale','Investment purchase','Investment sale','Estate sale','Estate closure','Ownership transfer','Debt discharge'];const rows=state.ledger.filter(e=>e.age===age&&e.account==='Personal'&&!excluded.includes(e.category));return {income:rows.filter(e=>e.amount>0).reduce((n,e)=>n+e.amount,0),expenses:-rows.filter(e=>e.amount<0).reduce((n,e)=>n+e.amount,0)}}
function valueBars(title,rows){const max=Math.max(1,...rows.map(r=>Math.abs(r[1])));return `<div class="card actioncard"><h3>${esc(title)}</h3>${rows.map(([label,value])=>`<div class="visual-row"><span>${esc(label)}</span><strong>${cash(value)}</strong><div class="bar"><i style="width:${Math.abs(value)/max*100}%;background:${value<0?'#b64c58':'#278264'}"></i></div></div>`).join('')||'<p>No recorded data yet.</p>'}<details><summary>Exact figures</summary><table class="ledger"><tbody>${rows.map(([label,value])=>`<tr><th>${esc(label)}</th><td>${cash(value)}</td></tr>`).join('')}</tbody></table></details></div>`}
function wealthGraph(){const map=new Map();for(const h of state.rewindHistory||[])if(h.generation===state.generation&&h.name===state.name)map.set(h.age,Life.netWorth(h));map.set(state.age,Life.netWorth(state));const rows=[...map].sort((a,b)=>a[0]-b[0]).filter(([age])=>!chartRange||age>=state.age-chartRange);const values=rows.map(r=>r[1]),lo=Math.min(0,...values),hi=Math.max(1,...values),span=hi-lo;const y=v=>155-(v-lo)/span*125,x=i=>45+i*510/Math.max(1,rows.length-1);return `<div class="card actioncard"><div class="sectionhead"><h3>Net worth over time</h3><div class="rowactions">${[5,10,0].map(n=>btn(n?n+' years':'Recorded history','chart-range',n,false,n===chartRange?'primary small':'small')).join('')}</div></div><svg class="wealth-plot" viewBox="0 0 600 195" role="img" aria-label="Net worth history, with zero baseline. Use the slider below to inspect exact values."><line x1="45" x2="565" y1="${y(0)}" y2="${y(0)}" stroke="#91a7a0" stroke-dasharray="4 4"/><text x="4" y="${y(0)-5}">$0</text><polyline points="${rows.map((r,i)=>x(i)+','+y(r[1])).join(' ')}" fill="none" stroke="#168262" stroke-width="3"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[1])}" r="4" fill="${r[1]<0?'#b64c58':'#168262'}"><title>Age ${r[0]}: ${cash(r[1])}</title></circle>`).join('')}<text x="45" y="185">Age ${rows[0][0]}</text><text x="500" y="185">Age ${state.age}</text></svg><div class="chart-inspector"><label for="wealth-cursor">Explore the chart · slide or tap to select a year</label><input id="wealth-cursor" type="range" min="0" max="${rows.length-1}" step="1" value="${rows.length-1}" data-points="${esc(JSON.stringify(rows))}" aria-valuetext="Age ${rows.at(-1)[0]}: ${cash(rows.at(-1)[1])}" ${rows.length===1?'disabled':''}><output id="wealth-readout" for="wealth-cursor" aria-live="polite">Age ${rows.at(-1)[0]} · ${cash(rows.at(-1)[1])}</output></div><p>Tracking starts at age ${rows[0][0]} in this view. Only saved year boundaries and the current balance are shown; missing years are not reconstructed.</p><details><summary>Inspect exact values</summary><table class="ledger"><tbody>${rows.map(([age,value])=>`<tr><th>Age ${age}</th><td>${cash(value)}</td></tr>`).join('')}</tbody></table></details></div>`}
function financeVisuals(){const ages=[...new Set(state.ledger.filter(e=>e.account==='Personal').map(e=>e.age))].sort((a,b)=>a-b).slice(-5);const assets=[['Positive cash',Math.max(0,state.cash)],...['homes','cars','jewelry'].map(k=>[k,state.assets.filter(a=>Life.assetCategory(a)===k).reduce((n,a)=>n+a.value,0)]),['Investments',Life.portfolioValue(state)],['Business capital',Math.max(0,state.business?.capital||0)],['Liabilities',-(state.loans.reduce((n,l)=>n+l.balance,0)+(state.financialManager?.due||0)+Math.max(0,-state.cash))]];return `${wealthGraph()}<div class="grid sectionspace">${valueBars('Cash receipts & spending · recorded years',ages.flatMap(age=>{const v=yearlyCash(age);return [['Age '+age+' · income',v.income],['Age '+age+' · spending',-v.expenses]]}))}${valueBars('Wealth composition',assets)}</div><p class="sub">Cash flow excludes financing, principal repayments and asset trades. Gifts and inheritances are included as cash receipts; appreciation is not income.</p>`}
function portfolioVisuals(){const m=state.financialManager?.reports[0];return `<div class="grid sectionspace">${valueBars('Investment allocation',state.portfolio.map(h=>[Life.investmentProducts.find(p=>p.id===h.ticker).name,Math.round(h.units*state.market[h.ticker])]))}${m?valueBars('Latest manager report',[...(m.yearlyIncome!==undefined?[['Income used',m.yearlyIncome]]:[]),...(m.target!==undefined?[['Investment target',m.target]]:[]),['Actually invested',m.spent],['Net return',m.profit],['Fee earned',-m.fee]]):'<div class="card actioncard"><h3>Financial manager</h3><p>Your first annual report will appear after hiring a manager and aging up.</p></div>'}</div>`}
function assetOverview(){const homeNames=new Set(state.assets.filter(a=>Life.assetCategory(a)==='homes').map(a=>a.name));const entries=state.ledger.filter(e=>e.age===state.age&&e.account==='Personal'&&homeNames.has(e.reason));const rent=entries.filter(e=>e.category==='Rent').reduce((n,e)=>n+e.amount,0),costs=entries.filter(e=>['Upkeep','Property management'].includes(e.category)).reduce((n,e)=>n+e.amount,0);return `${valueBars('Owned property · recorded cash flow before tax',[['Rent received',rent],['Upkeep & management',costs],['Net before tax',rent+costs]])}<div class="grid asset-overview">${['homes','cars','jewelry'].map(k=>{const a=state.assets.filter(a=>Life.assetCategory(a)===k);return `<div class="card">${scene(k)}<div class="actioncard"><h3>${k==='homes'?'Homes & estates':k==='cars'?'Vehicles':'Jewelry'}</h3><p>${a.length} owned · ${cash(a.reduce((n,x)=>n+x.value,0))}<br>${a.filter(x=>x.needsRepair).length} need repair${k==='homes'?' · '+a.filter(x=>x.rented).length+' offered for rent':''}</p></div></div>`}).join('')}</div>`}
function overviewHighlights(){const v=yearlyCash(state.age);return `<div class="banner"><div class="eyebrow">THIS YEAR AT A GLANCE</div><h2>${state.time} possibilities left.</h2><p>${state.invitations.filter(i=>i.status==='Pending').length} invitations · ${state.promises.filter(p=>p.status==='Open').length} open commitments · ${state.assets.filter(a=>a.needsRepair).length} assets need repair</p></div><div class="minigrid">${metric('Cash received',cash(v.income))}${metric('Cash spent',cash(v.expenses))}${metric('Cash surplus',cash(v.income-v.expenses))}</div>`}

function careerVisuals(){const points=(state.rewindHistory||[]).filter(h=>h.generation===state.generation&&h.job).slice(-5);return `<div class="card actioncard"><h3>Your working life</h3><p>${esc(Life.status(state))} · ${esc(state.education)}</p>${state.job?`<label>Performance · ${state.performance}%</label><progress max="100" value="${state.performance}"></progress>`:''}<details><summary>Recorded career checkpoints</summary>${points.map(h=>`<p>Age ${h.age} · ${esc(h.job.name)} · ${cash(h.job.pay)}/year</p>`).join('')||'<p>Tracking starts with your next recorded working year.</p>'}</details></div>`}
function yearReviewSummary(){const v=yearlyCash(state.age),last=state.rewindHistory?.at(-1),change=last&&last.generation===state.generation?Life.netWorth(state)-Life.netWorth(last):null;return `<div class="year-review"><div class="eyebrow">YEARLY REVIEW · AGE ${state.age}</div><div class="minigrid">${metric('Cash received',cash(v.income))}${metric('Cash spent',cash(v.expenses))}${metric('Net worth change',change===null?'Not recorded':cash(change))}</div><p><b>Needs attention:</b> ${state.pending?'A personal choice. ':''}${state.familyDecisions.length} education decisions.</p><p><b>Optional:</b> ${state.invitations.filter(i=>i.status==='Pending').length} invitations · ${state.assets.filter(a=>a.needsRepair).length} repairs · ${state.promises.filter(p=>p.status==='Open').length} commitments.</p></div>`}

function compactMoney(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',minimumFractionDigits:0,maximumFractionDigits:1}).format(n)}
function mobileCharacterHeader(){return `<div class="phone-character"><div class="phone-identity">${portrait(state)}<div><strong>${esc(state.name)}</strong><small>Age ${state.age} · ${state.time}/32 energy</small></div><strong>${compactMoney(state.cash)}</strong></div><details id="mobile-character-details" ${mobileDetailsOpen?'open':''}><summary>Exact balances & personal statistics</summary><dl><dt>Cash</dt><dd>${cash(state.cash)}</dd><dt>Net worth</dt><dd>${cash(Life.netWorth(state))}</dd><dt>Generation</dt><dd>${state.generation}</dd>${Object.entries(state.stats).map(([key,v])=>`<dt>${esc(key)}</dt><dd>${v}%</dd>`).join('')}</dl></details></div>`}
function inspectWealthPoint(input){const rows=JSON.parse(input.dataset.points),index=Math.max(0,Math.min(rows.length-1,Number(input.value)));const point=rows[index];if(!point)return;const text='Age '+point[0]+' · '+cash(point[1]);$('wealth-readout').textContent=text;input.setAttribute?.('aria-valuetext',text);const circles=document.querySelectorAll?.('.wealth-plot circle');circles?.forEach((circle,i)=>{circle.setAttribute('r',i===index?'7':'4');circle.setAttribute('stroke',i===index?'#19332f':'none');circle.setAttribute('stroke-width','2')})}
// Keep bottom controls out of the way when a phone keyboard is editing a field.
function phoneEditing(active){if(window.matchMedia?.('(max-width: 850px)').matches)document.body?.classList.toggle('phone-editing',active)}
document.addEventListener('focusin',e=>{if(e.target.matches?.('input:not([type=range]):not([type=checkbox]),textarea,select'))phoneEditing(true)});
document.addEventListener('focusout',()=>{setTimeout(()=>phoneEditing(!!document.activeElement?.matches?.('input:not([type=range]):not([type=checkbox]),textarea,select')),0)});
window.visualViewport?.addEventListener('resize',()=>{const v=window.visualViewport;if(document.documentElement)document.documentElement.style.setProperty('--visible-height',v.height+'px')});
function tapWealthChart(e){const plot=e.target.closest?.('.wealth-plot');if(!plot||e.type==='pointermove'&&!e.buttons)return;const input=$('wealth-cursor');if(!input)return;const bounds=plot.getBoundingClientRect(),rows=JSON.parse(input.dataset.points);const proportion=Math.max(0,Math.min(1,((e.clientX-bounds.left)/bounds.width*600-45)/510));input.value=String(Math.round(proportion*(rows.length-1)));inspectWealthPoint(input);if(e.type==='pointerdown')plot.setPointerCapture?.(e.pointerId)}
document.addEventListener('pointerdown',tapWealthChart);
document.addEventListener('pointermove',tapWealthChart);
// Integrated additions: shared rendering helpers keep the mobile layout compact.
function ebtn(label,type,data={},disabled=false){return `<button type="button" class="btn" data-do="enhance" data-payload="${esc(JSON.stringify({type,...data}))}" ${disabled?'disabled':''}>${esc(label)}</button>`}
function favoriteButton(kind,id){const selected=state.favorites?.some(f=>f.kind===kind&&f.id===id);return ebtn(selected?'Remove favorite':'Favorite', 'favorite',{kind,id})}
function changesPanel(personId){const rows=(state.changeReasons||[]).filter(x=>personId===undefined?!x.personId:x.personId===personId).slice().reverse();return `<details class="explain-panel"><summary>Why did this change?</summary><p>Recorded changes this year. Annual entries combine the year’s events; transaction details remain in Finances. Up to 80 recent changes are retained.</p>${rows.map(x=>`<p><b>${esc(x.metric)} ${x.delta>0?'+':''}${['Cash','Net worth'].includes(x.metric)?cash(x.delta):x.delta}</b> · ${esc(x.reason)}</p>`).join('')||'<p>New changes will be explained here as you play.</p>'}</details>`}
function favoritesPanel(){const favorites=state.favorites||[];return `<div class="card actioncard"><h3>Favorites</h3><div class="rowactions">${favorites.map(f=>{const item=f.kind==='person'?state.people.find(p=>p.id===f.id):f.kind==='asset'?state.assets.find(a=>a.uid===f.id):{name:f.id};return item?btn(item.name,f.kind==='person'?'person':f.kind==='asset'?'asset-details':'tab',f.id)+ebtn('Remove '+item.name,'favorite',f):''}).join('')||'<p>Pin a person, possession or section for quick access. Up to six shortcuts.</p>'}</div>${changesPanel()}</div>`}
function forecastPanel(){const f=Life.forecast(state);return `<div class="card actioncard"><div class="eyebrow">PLAN THE NEXT YEAR</div><h3>Affordability forecast</h3><div class="minigrid">${metric('Expected income',cash(f.income))}${metric('Costs & allowances',cash(f.costs))}${metric('Manager contributions',cash(f.reinvestment))}${metric('Projected cash',cash(f.closing))}</div><p class="${f.closing<state.reservedCash?'negative':''}">${f.closing<state.reservedCash?'Your plan falls below your chosen reserve.':'Your expected balance covers your chosen reserve.'} With no rent and an extra ${cash(Math.max(2000,Life.householdCost(state)*.1))} buffer, cash would be about ${cash(f.stress)}.</p><details><summary>Estimate details and assumptions</summary>${Object.entries(f.rows).map(([label,value])=>`<p>${esc(label)}: ${cash(value)}</p>`).join('')}<p>Uses current salary and prices with expected vacancy and disputes. Allowances are shown before affordability caps. Excludes business results, gifts, inheritance, future raises, emergencies, manager profit fees and new discretionary spending. This is an estimate, not a guaranteed balance.</p></details><form class="enhancement-form"><input type="hidden" name="type" value="reserve"><label for="planning-reserve">Cash reserve for planning and automatic investing</label><input id="planning-reserve" name="amount" value="${state.reservedCash||0}" maxlength="40" required><button class="btn" type="submit">Save reserve</button></form>${changesPanel()}</div>`}
function strategyPanel(){const m=state.financialManager;return `<div class="card actioncard"><h3>Manager strategy · ${esc(m?.strategy||'Balanced')}</h3><p>Choose how new contributions are divided. All strategies retain the 5% profit-only fee and loss recovery. No strategy guarantees profit.</p><details><summary>Compare allocations</summary><p>Preserve: 80% bonds, 20% global fund. Balanced: up to 40% homes and 10% jewelry; remaining money is 50% global, 30% bonds, 20% stocks. Growth: up to 25% homes and 5% jewelry; remaining money is 45% global, 10% bonds, 45% stocks. Unaffordable physical purchases flow into funds and stocks.</p></details><div class="rowactions">${['Preserve','Balanced','Growth'].map(strategy=>ebtn(strategy,'strategy',{strategy},!m||m.strategy===strategy)).join('')}</div>${!m?'<p>Hire your manager below to choose a strategy.</p>':''}</div>`}
function careerEnhancements(){return `<div class="card actioncard"><h3>Compare employers</h3><p>Search once per year for two competing offers in a qualified career. Costs 1 time. Offers expire at your next birthday. Existing single-employer applications remain available.</p><form class="enhancement-form"><input name="type" type="hidden" value="offers"><label for="offer-career">Career to explore</label><select id="offer-career" name="jobId">${Life.jobs.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('')}</select><button class="btn" type="submit" ${state.age<18||state.used.offerSearch?'disabled':''}>Find competing offers</button></form>${(state.jobOffers||[]).map(o=>`<div class="listrow"><div><h4>${esc(o.label)}</h4><p>${cash(o.pay)}/year · ${esc(o.culture)} culture<br>${Math.round(o.layoffRisk*100)}% annual layoff chance, plus poor-performance risk · Promotion needs ${o.promotionTarget} performance, 30 skill and two years.</p></div>${ebtn('Accept offer','acceptOffer',{id:o.id})}</div>`).join('')}${state.job?.culture?`<p>Current employer: ${esc(state.job.culture)} · ${Math.round(state.job.layoffRisk*100)}% layoff chance.</p>`:''}</div><div class="card actioncard"><h3>Mentorships</h3><p>Ask a trusted adult connection with five recorded years of work experience to mentor you. Start in their relationship profile. Sessions use 1 time yearly.</p>${(state.mentorships||[]).map(m=>{const p=state.people.find(p=>p.id===m.personId);return `<div class="listrow"><div><b>${esc(p?.name||'Former connection')}</b><p>${m.sessions} sessions · ${esc(Life.jobs.find(j=>j.id===m.field)?.name)}</p></div><div class="rowactions">${ebtn('Meet mentor','mentorSession',{personId:m.personId},!p?.alive||m.lastAge===state.age)}${ebtn('End mentorship','mentorEnd',{personId:m.personId})}</div></div>`}).join('')||'<p>No active mentorships.</p>'}</div>`}
function clubsPanel(){return `<div class="card actioncard"><h3>Clubs & shared routines</h3><p>Meet the same people over time. Joining and each annual visit cost 1 time. Membership starts at age 12.</p>${['Running','Art','Music','Volunteering'].map(kind=>{const c=(state.clubs||[]).find(c=>c.kind===kind);return `<details><summary>${kind}${c?' · '+c.visits+' visits':''}</summary>${c?`<p>${c.members.map(id=>esc(state.people.find(p=>p.id===id)?.name||'Former member')).join(', ')}</p><div class="rowactions">${ebtn('Attend · 1 time','clubAttend',{club:kind},c.lastAge===state.age)}${ebtn('Leave club','clubLeave',{club:kind})}</div>${c.memories.map(m=>`<p>Age ${m.age} · ${esc(m.text)}</p>`).join('')}`:ebtn('Join '+kind,'clubJoin',{club:kind},state.age<12)}</details>`}).join('')}</div>`}
function personEnhancements(p){const m=(state.mentorships||[]).find(m=>m.personId===p.id);return `<div class="card actioncard"><h3>What matters to ${esc(p.name)}</h3><p>${p.need?.known?esc(p.need.kind):'Their needs emerge through conversation.'}</p><div class="rowactions">${favoriteButton('person',p.id)}${p.alive?ebtn(p.need?.known?'Support this need · 1 time':'Ask what matters · 1 time',p.need?.known?'needRespond':'needDiscover',{personId:p.id},!!state.used['need-'+p.id])+ebtn(m?'Meet mentor · 1 time':'Ask for mentorship',m?'mentorSession':'mentorStart',{personId:p.id},state.age<18||p.age<18):''}</div>${changesPanel(p.id)}</div>`}
function showAssetDetails(id){const a=state.assets.find(a=>a.uid===Number(id));if(!a){toast('This asset is no longer owned.');return}modal(`<h2>${esc(a.name)}</h2><p>${cash(a.value)} · ${a.assetAge} years old</p>${favoriteButton('asset',a.uid)}<h3>Family heirloom</h3><p>${a.heirloom?'First designated by '+esc(a.heirloom.origin)+'. Gifts add extra bond; inheriting brings happiness. Selling has an emotional cost.':'Give this possession meaning beyond its price. Up to twelve designated keepsakes; six memories per asset.'}</p>${ebtn(a.heirloom?'Remove designation':'Designate as heirloom','heirloom',{assetId:a.uid},state.age<18)}${a.heirloom?.memories.map(m=>`<p>${esc(m)}</p>`).join('')||''}${Life.assetCategory(a)==='homes'?`<h3>Tenant & lease</h3><p>${a.lease?esc(a.lease.tenant)+' · '+cash(a.lease.rent)+'/year · '+(state.age>=a.lease.renewAt?'Ready to renew': 'Renew at age '+a.lease.renewAt):'Automatic rentals currently use yearly vacancy and dispute risk.'}</p><p>Stable tenant: 6% of current value in annual rent, 3% dispute chance. Market lease: 7% rent, 8% dispute chance. Rent stays fixed for two years. Damage still reduces receipts. Each agreement takes 1 time. Expired leases continue at the agreed rent until you decide.</p><div class="rowactions">${['stable','market'].map(mode=>ebtn(mode==='stable'?'Stable tenant / renewal':'Market lease / renewal','lease',{assetId:a.uid,mode},!a.rented||!!a.lease&&state.age<a.lease.renewAt)).join('')}${a.lease?ebtn('Release to automatic rental','lease',{assetId:a.uid,mode:'release'}):''}</div>${!a.rented?'<p>Rent out this home first to sign a lease.</p>':''}`:''}`)}
function enhancementClick(a,id,b){if(a==='enhance'){const payload=JSON.parse(b.dataset.payload);refresh(Life.enhance(state,payload.type,payload));return true}if(a==='asset-details'){showAssetDetails(id);return true}if(a==='recovery-enable'){recoveryEpoch++;recoverySavedState=null;recoveryEnabled=true;recoveryReady=true;try{localStorage.setItem('parallel-recovery','yes')}catch{}scheduleRecovery();render();return true}if(a==='recovery-disable'){recoveryEnabled=false;recoveryEpoch++;clearTimeout(recoveryTimer);recoveryAgain=false;recoveryPhase='idle';recoveryStatus='Device recovery is off.';try{localStorage.removeItem('parallel-recovery')}catch{}render();return true}if(a==='recovery-restore'){confirmAction('Restore this device checkpoint?','Download your current life first if you want to keep it. Recovery checkpoints include the latest three undo years.','recovery-confirm',id);return true}if(a==='recovery-confirm'){restoreRecovery(id);return true}return false}

// Device recovery is opt-in. Two size-limited checkpoints; manual downloads retain full history.
let recoveryEnabled=false,recoveryReady=false,recoveryRecords=[],recoveryStatus='Device recovery is off.',recoveryTimer,recoveryWriting=false,recoveryAgain=false,recoveryEpoch=0,recoverySavedState=null,recoverySavedRevision=-1,recoveryPhase='idle';
function recoveryPanel(){return `<div class="card actioncard"><h3>Continue & device recovery</h3><p id="recovery-status" role="status">${esc(recoveryStatus)}</p><p>Optional backup on this browser only. Keeps two checkpoints with the latest three undo years, up to 8 MB each. Browser cleanup can remove them. Download saves to keep the full history or move devices.</p><div id="recovery-checkpoints">${recoveryRecords.map(x=>`<div class="listrow"><div><b>${esc(x.name)} · Age ${x.age}</b><p>${esc(new Date(x.savedAt).toLocaleString())}</p></div>${btn('Restore checkpoint','recovery-restore',x.id)}</div>`).join('')}</div><div class="rowactions">${btn(recoveryEnabled&&recoveryReady?'Recovery enabled':'Use this life for recovery','recovery-enable','',recoveryEnabled&&recoveryReady)}${recoveryEnabled?btn('Turn off recovery','recovery-disable'):''}</div></div>`}
function recoveryDB(){return new Promise((resolve,reject)=>{if(typeof indexedDB==='undefined'){reject(Error('Device storage is unavailable in this browser.'));return}const req=indexedDB.open('parallel-recovery-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('checkpoints',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Device storage could not open.'))})}
async function readRecovery(){const db=await recoveryDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('checkpoints','readonly'),req=tx.objectStore('checkpoints').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function initRecovery(){if(typeof indexedDB==='undefined')return;try{recoveryEnabled=localStorage.getItem('parallel-recovery')==='yes';recoveryRecords=(await readRecovery()).sort((a,b)=>b.savedAt-a.savedAt);recoveryReady=!recoveryRecords.length;recoveryStatus=recoveryRecords.length?'A previous life is available. Restore it or choose this life for future checkpoints.':recoveryEnabled?'Recovery enabled. Your next action will create a checkpoint.':'Device recovery is off.';render()}catch(err){recoveryPhase='error';recoveryStatus='Recovery unavailable: '+err.message;recoveryEnabled=false;render()}}
function deviceSaveLabel(){if(recoveryPhase==='error')return 'Device backup failed · download a save';if(!recoveryEnabled)return 'Device recovery off';if(!recoveryReady)return 'Choose a checkpoint to continue';if(recoveryWriting||recoveryPhase==='queued')return 'Saving on this device…';if(recoverySavedState===state&&recoverySavedRevision===lifeRevision)return 'Saved on this device';return 'Device backup pending'}
function updateRecoveryUI(){const badge=$('device-save-badge');if(badge)badge.textContent=deviceSaveLabel();const status=$('recovery-status');if(status)status.textContent=recoveryStatus;const list=$('recovery-checkpoints');if(list)list.innerHTML=recoveryRecords.map(x=>`<div class="listrow"><div><b>${esc(x.name)} · Age ${x.age}</b><p>${esc(new Date(x.savedAt).toLocaleString())}</p></div>${btn('Restore checkpoint','recovery-restore',x.id)}</div>`).join('')}
function scheduleRecovery(){if(!recoveryEnabled||!recoveryReady){updateRecoveryUI();return}clearTimeout(recoveryTimer);recoveryPhase='queued';updateRecoveryUI();if(document.visibilityState==='hidden'){void writeRecovery();return}recoveryTimer=setTimeout(writeRecovery,700)}
function flushRecovery(){clearTimeout(recoveryTimer);if(!recoveryEnabled||!recoveryReady||recoverySavedState===state&&recoverySavedRevision===lifeRevision)return Promise.resolve();return writeRecovery()}
async function writeRecovery(){if(!recoveryEnabled||!recoveryReady)return;if(recoveryWriting){recoveryAgain=true;return}clearTimeout(recoveryTimer);recoveryWriting=true;recoveryPhase='writing';updateRecoveryUI();const savedState=state,revision=lifeRevision,epoch=recoveryEpoch;try{const checkpoint={...state};if(checkpoint.rewindHistory)checkpoint.rewindHistory=checkpoint.rewindHistory.slice(-3);const stamp=Math.max(Date.now(),...recoveryRecords.map(x=>x.id+1)),record={id:stamp,savedAt:stamp,name:state.name,age:state.age,release:GAME_RELEASE.version};let blob=new Blob([JSON.stringify(Life.packSave(checkpoint))],{type:'application/json'});if(typeof CompressionStream==='function')blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();if(blob.size>8*1024*1024)throw Error('Checkpoint exceeds 8 MB. Use a downloaded save.');if(!recoveryEnabled||!recoveryReady||epoch!==recoveryEpoch)return;record.blob=blob;const db=await recoveryDB();try{if(epoch!==recoveryEpoch||!recoveryEnabled)return;await new Promise((resolve,reject)=>{const tx=db.transaction('checkpoints','readwrite'),store=tx.objectStore('checkpoints');store.put(record);const req=store.getAll();req.onsuccess=()=>{for(const old of req.result.sort((a,b)=>b.savedAt-a.savedAt).slice(2))store.delete(old.id)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Backup interrupted.'))})}finally{db.close()}recoveryRecords=(await readRecovery()).sort((a,b)=>b.savedAt-a.savedAt);if(epoch===recoveryEpoch){recoverySavedState=savedState;recoverySavedRevision=revision;recoveryPhase='idle';recoveryStatus='Device checkpoint saved at age '+record.age+'. Download saves remain separate.';if(state!==savedState||lifeRevision!==revision)recoveryAgain=true}}catch(err){recoveryPhase='error';recoveryStatus='Recovery not saved: '+err.message;toast(recoveryStatus)}finally{recoveryWriting=false;if(epoch!==recoveryEpoch)recoveryPhase='idle';updateRecoveryUI();if(recoveryAgain){recoveryAgain=false;scheduleRecovery()}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')void flushRecovery()});
window.addEventListener('pagehide',()=>{void flushRecovery()});
async function restoreRecovery(id){try{const record=recoveryRecords.find(x=>x.id===Number(id));if(!record)throw Error('Checkpoint is unavailable.');const candidate=await readLifeFile(record.blob);recoveryEpoch++;state=candidate;Life.ensure(state);lifeRevision++;dirty=false;recoveryReady=true;recoverySavedState=state;recoverySavedRevision=lifeRevision;recoveryPhase='idle';recoveryStatus='Restored device checkpoint at age '+state.age+'.';tab='journal';financeAge='all';financeAccount='all';close();render();toast('Device checkpoint restored.')}catch(err){toast('Could not restore: '+err.message)}}

const originalJournal=journal,originalFinances=finances,originalCareer=career,originalPlans=plans,originalInvestments=investments;
journal=function(){return favoritesPanel()+originalJournal()+recoveryPanel()};
finances=function(){return favoriteButton('section','finances')+forecastPanel()+originalFinances()};
career=function(){return favoriteButton('section','career')+careerEnhancements()+originalCareer()};
plans=function(){return favoriteButton('section','plans')+clubsPanel()+originalPlans()};
investments=function(){return favoriteButton('section','investments')+strategyPanel()+originalInvestments()};
render();
initRecovery();
</script></body></html>
